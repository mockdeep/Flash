# Files in the config/locales directory are used for internationalization
# and are automatically loaded by Rails. If you want to use locales other
# than English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t 'hello'
#
# In views, this is aliased to just `t`:
#
#     <%= t('hello') %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# The following keys must be escaped otherwise they will not be retrieved by
# the default I18n backend:
#
# true, false, on, off, yes, no
#
# Instead, surround them with single quotes.
#
# en:
#   'true': 'foo'
#
# To learn more, please read the Rails Internationalization guide
# available at https://guides.rubyonrails.org/i18n.html.

en:
  components:
    card_preview:
      empty: "This deck has no cards yet."
  accounts:
    create:
      success: "Account created successfully"
      error: "There was a problem setting up your account"
    update:
      success: "Account updated successfully"
      error: "There was a problem updating your account"
    destroy:
      success: "Account permanently deleted"
  catalog:
    copy:
      success: "Deck copied successfully"
  catalog_listings:
    create:
      success: "Deck added to catalog"
    destroy:
      success: "Deck removed from catalog"
      confirm: "Remove this deck from the catalog?"
  cards:
    destroy:
      success: "Card deleted"
      confirm: "Delete this card? This cannot be undone."
  decks:
    create:
      success: "Deck created successfully"
    destroy:
      success: "Deck deleted"
      confirm: "Delete this deck and all its cards? This cannot be undone."
  replacements:
    create:
      success: "Replaced cards: %{added} added, %{removed} removed, %{reset} reset, %{kept} kept"
    unsupported: "Replace is only available for text decks"
  reversals:
    create:
      success: "Reverse deck created"
      error: "This deck can't be reversed"
  shares:
    copy:
      success: "Deck copied successfully"
    create:
      success: "Share link created"
    destroy:
      success: "Share link revoked"
      confirm: "Revoke the share link? Anyone using it will lose access."
  topic_assignments:
    create:
      success: "Added to the %{name} topic"
      blank: "Topic name can't be blank"
    destroy:
      success: "Removed from topic"
  sessions:
    create:
      error: "Invalid email or password"
  subscriptions:
    create:
      error: "Unable to create checkout session"
    destroy:
      success: "Subscription canceled successfully"
      error: "Unable to cancel subscription"
      missing: "No active subscription found"
